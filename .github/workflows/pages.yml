name: Déploiement GitHub Pages

# À chaque modification sur main : les tests d'abord, puis la publication si tout est vert.
on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Navigateur de test gardé en cache d'une exécution à l'autre
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultats-des-tests
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - run: |
          mkdir _site && cp index.html confidentialite.html app.js api.js config.js favicon.svg favicon-32.png apple-touch-icon.png _site/
          # Numéro de version dans les liens des scripts : le navigateur recharge les fichiers à chaque déploiement
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" _site/index.html _site/confidentialite.html
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
